<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ 海贼王知识库问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.15);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('/static/背景.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100%;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            width: 98vw;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 15px 0;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.5),
                0 0 20px rgba(255, 215, 0, 0.3),
                2px 2px 0px #1a4d7a;
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: bold;
            animation: fadeInDown 0.8s ease-out;
        }

        header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            animation: fadeInDown 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar {
            background: rgba(10, 20, 40, 0.5);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            gap: 5px;
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid transparent;
            position: relative;
        }

        .sidebar-tab.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .sidebar-tab.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #ffd700;
            border-radius: 2px;
        }

        .sidebar-tab .tab-icon {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 3px;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 11px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            transform: scaleY(0);
            transition: transform 0.3s;
            border-radius: 0 2px 2px 0;
        }

        .nav-item:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            transform: translateX(3px);
        }

        .nav-item:hover::before {
            transform: scaleY(1);
        }

        .nav-item .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .character-card:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.15);
        }

        .character-emoji {
            font-size: 1.9rem;
            margin-bottom: 6px;
        }

        .character-name {
            font-size: 0.82rem;
            color: rgba(255, 215, 0, 0.9);
            font-weight: 500;
        }

        .history-list {
            list-style: none;
            max-height: calc(100% - 80px);
            overflow-y: auto;
        }

        .history-item {
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 0.82rem;
            margin-bottom: 5px;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.02);
        }

        .history-item:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.15);
            color: #ffd700;
        }

        .history-item::before {
            content: '📖';
            font-size: 0.7rem;
            margin-right: 6px;
        }

        .clear-history {
            margin-top: 10px;
            padding: 7px 14px;
            font-size: 0.78rem;
            background: rgba(255, 69, 69, 0.1);
            border: 1px solid rgba(255, 69, 69, 0.25);
            color: rgba(255, 107, 107, 0.85);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
        }

        .clear-history:hover {
            background: rgba(255, 69, 69, 0.18);
            border-color: rgba(255, 69, 69, 0.4);
        }

        .quick-tags {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .quick-tag {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            position: relative;
            overflow: hidden;
        }

        .quick-tag:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.25);
            color: #ffd700;
            transform: translateX(5px);
        }

        .quick-tag .tag-label {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: rgba(10, 20, 40, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            margin-bottom: 10px;
            line-height: 1.6;
            position: relative;
            word-break: break-word;
            display: inline-block;
        }

        .message.bot {
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        .message.user {
            align-self: flex-end;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: rgba(255, 215, 0, 0.95);
            background: rgba(255, 215, 0, 0.08);
            backdrop-filter: blur(5px);
        }

        .message p {
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .message .time {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 6px;
            text-align: right;
            text-shadow: none;
        }

        .faq-section {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.1);
        }

        .faq-section h3 {
            color: rgba(255, 215, 0, 0.9);
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .faq-section h3::before {
            content: '💡';
            font-size: 0.9rem;
        }

        .faq-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .faq-tag {
            padding: 7px 14px;
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s;
            color: rgba(255, 215, 0, 0.85);
        }

        .faq-tag:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.3);
            color: #ffd700;
            transform: translateY(-2px);
        }

        .input-area {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 12px;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
            resize: none;
            overflow: hidden;
            min-height: 45px;
            max-height: 140px;
            line-height: 1.5;
            backdrop-filter: blur(5px);
        }

        .input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .input-area textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .input-area button {
            padding: 12px 25px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 140, 0, 0.2));
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .input-area button:hover {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.45), rgba(255, 140, 0, 0.35));
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.2);
        }

        .input-area button:disabled {
            background: rgba(100, 100, 100, 0.3);
            border-color: rgba(100, 100, 100, 0.3);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 45px;
            height: 45px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .scroll-to-top.show {
            opacity: 1;
            visibility: visible;
        }

        .scroll-to-top:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateY(-3px);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: rgba(255, 215, 0, 0.5);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                order: 2;
            }
            
            .chat-area {
                order: 1;
            }
            
            .characters-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
            
            .sidebar-tabs {
                flex-wrap: wrap;
            }
            
            .sidebar-tab {
                min-width: 60px;
                font-size: 0.75rem;
            }
            
            .characters-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .chat-box {
                padding: 12px;
            }
            
            .message {
                max-width: 95%;
                padding: 10px 12px;
            }
            
            .input-area {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏴‍☠️ 海贼王知识库</h1>
            <p>探索伟大航路，解答你的海贼王疑问</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-tabs">
                    <div class="sidebar-tab active" onclick="switchTab('nav')">
                        <span class="tab-icon">📚</span>
                        <span>知识</span>
                    </div>
                    <div class="sidebar-tab" onclick="switchTab('characters')">
                        <span class="tab-icon">👥</span>
                        <span>人物</span>
                    </div>
                    <div class="sidebar-tab" onclick="switchTab('history')">
                        <span class="tab-icon">📜</span>
                        <span>记录</span>
                    </div>
                </div>
                
                <div class="sidebar-content">
                    <div id="nav-tab" class="tab-panel active">
                        <ul class="nav-list">
                            <li class="nav-item" onclick="sendQuestion('介绍一下海贼王的主要人物')">
                                <span class="icon">👤</span>
                                <span>人物介绍</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('恶魔果实有哪些种类？')">
                                <span class="icon">🍎</span>
                                <span>恶魔果实</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('海贼王中有哪些重大事件？')">
                                <span class="icon">⚔️</span>
                                <span>重大事件</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('海贼王的世界观是怎样的？')">
                                <span class="icon">🌍</span>
                                <span>世界观</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('四皇是谁？')">
                                <span class="icon">👑</span>
                                <span>四皇档案</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('七武海有哪些？')">
                                <span class="icon">⚓</span>
                                <span>七武海</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('海军高层有哪些人？')">
                                <span class="icon">🔱</span>
                                <span>海军高层</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('革命军是什么组织？')">
                                <span class="icon">📢</span>
                                <span>革命军</span>
                            </li>
                            <li class="nav-item" onclick="sendQuestion('各大海贼团有哪些？')">
                                <span class="icon">🚢</span>
                                <span>海贼团</span>
                            </li>
                            <li class="nav-item" onclick="sendRandomQuestion()">
                                <span class="icon">🎲</span>
                                <span>随机问题</span>
                            </li>
                        </ul>
                    </div>
                    
                    <div id="characters-tab" class="tab-panel">
                        <div class="characters-grid">
                            <div class="character-card" onclick="sendQuestion('介绍一下路飞')">
                                <div class="character-emoji">👒</div>
                                <div class="character-name">路飞</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下索隆')">
                                <div class="character-emoji">⚔️</div>
                                <div class="character-name">索隆</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下娜美')">
                                <div class="character-emoji">🌊</div>
                                <div class="character-name">娜美</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下山治')">
                                <div class="character-emoji">🍳</div>
                                <div class="character-name">山治</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下乔巴')">
                                <div class="character-emoji">🦌</div>
                                <div class="character-name">乔巴</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下罗宾')">
                                <div class="character-emoji">🌸</div>
                                <div class="character-name">罗宾</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下弗兰奇')">
                                <div class="character-emoji">🤖</div>
                                <div class="character-name">弗兰奇</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下布鲁克')">
                                <div class="character-emoji">🎻</div>
                                <div class="character-name">布鲁克</div>
                            </div>
                            <div class="character-card" onclick="sendQuestion('介绍一下甚平')">
                                <div class="character-emoji">🐟</div>
                                <div class="character-name">甚平</div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="history-tab" class="tab-panel">
                        <ul class="history-list" id="historyList">
                            <li class="history-item" style="color:#999;">暂无历史记录</li>
                        </ul>
                        <button class="clear-history" onclick="clearHistory()">清空记录</button>
                    </div>
                </div>
            </aside>

            <div class="chat-area">
                <div class="chat-box" id="chatBox">
                    <div class="message bot">
                        <p>你好！我是海贼王专属知识库问答机器人。请问你想了解关于海贼王的什么内容？</p>
                        <div class="time">系统</div>
                    </div>
                </div>

                <div class="faq-section">
                    <h3>热门问题</h3>
                    <div class="faq-tags">
                        <span class="faq-tag" onclick="sendQuestion('路飞的悬赏金是多少？')">路飞悬赏</span>
                        <span class="faq-tag" onclick="sendQuestion('四皇是谁？')">四皇</span>
                        <span class="faq-tag" onclick="sendQuestion('七武海有哪些？')">七武海</span>
                        <span class="faq-tag" onclick="sendQuestion('革命军是什么组织？')">革命军</span>
                        <span class="faq-tag" onclick="sendQuestion('红发香克斯的实力如何？')">红发香克斯</span>
                        <span class="faq-tag" onclick="sendQuestion('黑胡子的能力是什么？')">黑胡子</span>
                    </div>
                </div>

                <div class="input-area">
                    <textarea id="questionInput" placeholder="输入你的问题..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                    <button id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <div class="scroll-to-top" id="scrollToTop" onclick="scrollToTop()">⬆️</div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const historyList = document.getElementById('historyList');
        const scrollToTopBtn = document.getElementById('scrollToTop');

        const randomQuestions = [
            '路飞的全名是什么？',
            '海贼王罗杰的遗言是什么？',
            '空岛篇讲了什么故事？',
            '和之国篇的主要敌人是谁？',
            '霸气有几种类型？',
            '橡胶果实的真正名字是什么？',
            '革命军的首领是谁？',
            '红发香克斯为什么断臂？',
            '乔巴的蓝波球有什么效果？',
            '黑胡子为什么能拥有两种果实能力？'
        ];

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function scrollToTop() {
            chatBox.scrollTop = 0;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            messageDiv.innerHTML = `<p>${text}</p><div class="time">${type === 'user' ? '你' : '助手'} · ${timeStr}</div>`;
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }

        function sendQuestion(question) {
            questionInput.value = question;
            autoResize(questionInput);
            sendMessage();
        }

        function sendRandomQuestion() {
            const randomIndex = Math.floor(Math.random() * randomQuestions.length);
            sendQuestion(randomQuestions[randomIndex]);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage(question, 'user');
            addToHistory(question);
            questionInput.value = '';
            questionInput.style.height = 'auto';
            sendBtn.disabled = true;

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            chatBox.appendChild(typingDiv);
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();
                chatBox.removeChild(typingDiv);
                addMessage(data.data, 'bot');
            } catch (error) {
                chatBox.removeChild(typingDiv);
                addMessage('网络错误，请稍后重试', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function addToHistory(question) {
            let history = JSON.parse(localStorage.getItem('onepiece_history') || '[]');
            history = history.filter(h => h !== question);
            history.unshift(question);
            if (history.length > 10) history.pop();
            localStorage.setItem('onepiece_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('onepiece_history') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-item" style="color:#999;">暂无历史记录</li>';
                return;
            }
            historyList.innerHTML = history.map(item => 
                `<li class="history-item" onclick="sendQuestion('${item}')">${item}</li>`
            ).join('');
        }

        function clearHistory() {
            localStorage.removeItem('onepiece_history');
            renderHistory();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.sidebar-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            const clickedTab = event.currentTarget;
            clickedTab.classList.add('active');
            
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        chatBox.addEventListener('scroll', () => {
            if (chatBox.scrollTop > 300) {
                scrollToTopBtn.classList.add('show');
            } else {
                scrollToTopBtn.classList.remove('show');
            }
        });

        renderHistory();
    </script>
</body>
</html>
